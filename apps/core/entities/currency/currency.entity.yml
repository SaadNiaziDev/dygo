label: Currency
description: Currency codes and formatting defaults for monetary values.
icon: circle-dollar-sign
name:
  strategy: format
  format: "{code}"
tabs:
  - tab: Identity
    name: identity
    icon: shield-check
    fields:
      - name: code
        label: Code
        type: text
        required: true
        unique: true

      - name: split
        label: Split
        type: column

      - name: display-name
        label: Display Name
        type: text

      - name: symbol
        label: Symbol
        type: text

  - tab: Formatting
    name: formatting
    icon: settings-2
    fields:
      - name: numeric-code
        label: Numeric Code
        type: text

      - name: minor-unit-digits
        label: Minor Unit Digits
        type: int
        default: 2

      - name: rounding
        label: Rounding
        type: section
        description: Cash rounding defaults for this currency.

      - name: cash-rounding-increment
        label: Cash Rounding Increment
        type: decimal

      - name: enabled
        label: Enabled
        type: boolean
        index: true
        default: true
